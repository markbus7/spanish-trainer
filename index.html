<script>
/* Chrome en Edge op Windows tekenen vlag-emoji als letters («NL», «US»). Test dat op een canvas (letters zijn grijs, een vlag heeft kleur)
   en zet dan het vlaggenlettertype aan (klasse vlagfont, zie css/app.css). ?vlagfont=1 zet het altijd aan (om te testen). */
(function () {
  try {
    var force = /[?&]vlagfont=1/.test(location.search);
    var kleur = function (txt) {
      var c = document.createElement('canvas'); c.width = c.height = 20;
      var x = c.getContext('2d', { willReadFrequently: true }); x.textBaseline = 'top'; x.font = '16px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif'; x.fillText(txt, 0, 2);
      var d = x.getImageData(0, 0, 20, 20).data;
      for (var i = 0; i < d.length; i += 4) if (d[i + 3] > 40 && (Math.abs(d[i] - d[i + 1]) > 24 || Math.abs(d[i + 1] - d[i + 2]) > 24)) return true;
      return false;
    };
    if (force || (kleur('\uD83D\uDE0A') && !kleur('\uD83C\uDDF3\uD83C\uDDF1'))) document.documentElement.classList.add('vlagfont');
  } catch (e) {}
})();
</script>
