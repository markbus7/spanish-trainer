# Spreekt de vaste lesstof in (woorden, zinnen, dialogen, leesteksten) met neurale Latijns-Amerikaanse stemmen.
# Draait vanzelf als de lesstof op main verandert, of met de hand: Actions → Stemmen maken → Run workflow.
name: Stemmen maken
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['content/**', 'js/conjugate.js', 'js/curriculum.js', 'tools/**', '.github/workflows/stemmen.yml']
permissions:
  contents: write
concurrency:
  group: stemmen
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install "edge-tts>=7,<8"
      - run: node tools/tts-texts.js --stats > "$RUNNER_TEMP/texts.json"
      - run: python tools/tts-make.py "$RUNNER_TEMP/texts.json"
      - name: Opnames opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio
          if git diff --cached --quiet; then echo "Niets nieuws"; exit 0; fi
          git commit -q -m "Stemmen bijgewerkt"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
